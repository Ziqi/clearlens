name: ClearLens Deterministic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain-compliance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: FSFE REUSE 3.3 SPDX Licensing & Copyright Compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate OpenSSF SECURITY-INSIGHTS.yml, Offline CSP & SPDX 2.3 SBOM Determinism
        run: |
          python -m pip install --no-cache-dir --require-hashes -r .github/requirements-ci.txt
          python -c "import yaml; d=yaml.safe_load(open('SECURITY-INSIGHTS.yml')); assert d['header']['schema-version']=='2.0.0' and d['repository']['no-third-party-packages'] is True"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -m clearlens verify ./web
          python scripts/build_reproducible_bundle.py --verify --dist-dir /tmp/cl_dist
          python scripts/generate_spdx_sbom.py --verify --offline-zip /tmp/cl_dist/clearlens-offline-v1.0.0.zip --pyz /tmp/cl_dist/clearlens.pyz --output /tmp/cl_dist/clearlens-1.0.0.spdx.json

  test-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-pinned lint, coverage & SAST toolchain
        run: python -m pip install --no-cache-dir --require-hashes -r .github/requirements-ci.txt
      - name: Enforce coding standards (Ruff) & static vulnerability scan (Bandit)
        run: |
          ruff check clearlens tests scripts
          bandit -q -r clearlens scripts
      - name: Run unit & clean-room OPSEC tests with >=90% coverage gate
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -W error -m coverage run -m unittest discover -s tests -v
          python -m coverage report --include="clearlens/*" --fail-under=90
      - name: Build wheel & verify installed CLI entrypoint outside repo tree
        run: |
          python -m pip wheel . --no-deps --no-build-isolation -w dist/
          python -m pip install --no-deps dist/*.whl
          clearlens demo > /tmp/cl_demo.json
          python -c "import json; d=json.load(open('/tmp/cl_demo.json')); assert d['engine_3_ledger_exposure']['net_verified_exposure'] == '21153.00'"
